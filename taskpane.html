<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LSCM Hotkeys</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="taskpane.js"></script>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; margin: 16px; color: #002D57; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p, li { font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>LSCM Hotkeys</h1>
  <p id="status">Starting…</p>
  <ul>
    <li>Ctrl+W: yellow fill</li>
    <li>Ctrl+Q: blue font (#0000FF)</li>
    <li>Ctrl+J: center across selection with formatting</li>
    <li>Ctrl+Z undoes each one like a normal Excel action.</li>
  </ul>
</body>
</html>
